# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow requires that you have an existing account with codescan.io
# For more information about configuring your workflow,
# read our documentation at https://github.com/codescan-io/codescan-scanner-action
name: CodeScan

on:
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  schedule:
    - cron: "30 7 * * 1"

permissions:
  contents: read

jobs:
  CodeScan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache files
        uses: actions/cache@v3
        with:
          path: |
            ~/.sonar
          # v2: the action pinned below (5b2e8c5..., from 2020) bundled a
          # sonar-scanner-cli that ships with its own embedded Java 11 JRE and
          # ignores JAVA_HOME, so it always ran on Java 11 no matter what
          # `Set up Java 17` exported — the "Run Analysis" step failed with
          # UnsupportedClassVersionError (scanner class file version 61.0,
          # i.e. Java 17, but the embedded runtime only understood up to
          # 55.0/Java 11). The v3 action below adds JRE provisioning and a
          # newer embedded scanner CLI that actually honours JAVA_HOME, but a
          # cache keyed the same as before would still restore the old
          # incompatible binary into ~/.sonar. New key so it downloads fresh.
          key: ${{ runner.os }}-sonar-java17-v2
          restore-keys: ${{ runner.os }}-sonar-java17-
      - name: Run Analysis
        uses: codescan-io/codescan-scanner-action@0bc7259c0e362feda5c3e085f0f9fcf36c8d03ca # 3.0
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          PATH: ${{ env.JAVA_HOME }}/bin:${{ env.PATH }}
        with:
          login: ${{ secrets.CODESCAN_AUTH_TOKEN }}
          organization: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
          projectKey: ${{ secrets.CODESCAN_PROJECT_KEY }}
          # The pinned 2020 action only had one `generateSarifFile` flag
          # (defaulted true) for what this action now splits into a
          # server-side and a client-side report. `codescan.sarif` below is
          # produced locally, which is generateReportFile, not
          # generateSarifFile (server-side, unrelated to this workflow).
          generateReportFile: "true"
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codescan.sarif
